<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Wallet</title>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff; --card: #ffffff; --ink: #1c1d1f; --muted: #6b6e73; --line: #e6e6e6;
    --in: #1f8a4c; --out: #c0392b; --accent: #2d5bd7; --chip: #f3f3f3;
    --note-1: #8fae7e; --note-20: #5f8f6e; --note-ariary: #c98a4b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { background: var(--chip); border-radius: 999px; padding: 4px 10px; font-size: 13px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
  .dot.ok { background: var(--in); } .dot.bad { background: var(--out); }

  .grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; margin-top: 20px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .balance { font-size: 52px; font-weight: 650; letter-spacing: -0.02em; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .event { color: var(--muted); min-height: 1.4em; }
  .event.flash { animation: flash 1.2s ease; }
  @keyframes flash { from { color: var(--accent); } to { color: var(--muted); } }

  .stack { display: flex; flex-wrap: wrap-reverse; flex-direction: row-reverse; justify-content: flex-end;
           gap: 8px; }
  .bill { position: relative; width: 140px; aspect-ratio: 2.3 / 1; border-radius: 5px; overflow: hidden;
          background: #eee; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .bill img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .bill .tag { position: absolute; left: 5px; bottom: 4px; background: rgba(0,0,0,.6); color: #fff;
               font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 999px; }
  .stack-count { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 14px; }
  .cam { margin-top: 14px; display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
  .cam b { font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
       color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.new td { animation: rowin 1.5s ease; }
  @keyframes rowin { from { background: color-mix(in srgb, var(--accent) 15%, transparent); } to { background: transparent; } }
  .amt { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .amt.in { color: var(--in); } .amt.out { color: var(--out); }
  .sub { color: var(--muted); font-size: 12.5px; }
  select { font: inherit; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--card); color: var(--ink); max-width: 260px; width: 100%; }
  a { color: var(--accent); text-decoration: none; }
  .tablewrap { overflow-x: auto; }

  details { margin-top: 16px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  button { font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--chip); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.danger { color: var(--out); }
  .livedot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--in);
             margin-left: 4px; vertical-align: 1px; position: relative; }
  .livedot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--in);
                    animation: livepulse 2s ease-out infinite; }
  @keyframes livepulse { from { transform: scale(1); opacity: .6; } to { transform: scale(2.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .livedot::after { animation: none; } }
  body.demo .op-only { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Smart Wallet</h1>
    <div class="pills">
      <span class="pill op-only" id="camPill"><span class="dot"></span>Camera</span>
    </div>
  </header>

  <div class="grid">
    <div class="card">
      <div class="label">Balance</div>
      <div class="balance" id="balance">$0.00</div>
      <div class="cam op-only">
        <span>Camera sees <b id="camLabel">—</b></span>
        <span>Confidence <b id="camConf">—</b></span>
      </div>
    </div>
    <div class="card">
      <div class="stack" id="stack"></div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="label">Transactions</div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Amount</th><th>ER <span class="livedot" title="Live exchange rate"></span></th><th>Time</th><th>Location</th><th>Counterparty</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <details id="demo" class="op-only">
      <summary>Demo controls (simulate what the camera sees)</summary>
      <div class="controls">
        <button data-sim="none">none</button>
        <button data-sim="1">$1</button>
        <button data-sim="20">$20</button>
        <button data-sim="ariary">20,000 Ar</button>
        <button class="danger" id="reset">Reset wallet</button>
      </div>
    </details>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const NOTE_NAME = { "1": "$1", "20": "$20", "ariary": "20,000 Ar", "none": "none" };
const NOTE_IMG = { "1": "/static/notes/usd1.jpg", "20": "/static/notes/usd20.jpg", "ariary": "/static/notes/ariary20000.jpg" };
let lastStackKey = null;
let seen = new Set(), firstRender = true, lastEvent = null, lastTxKey = null;

function usd(v, signed) {
  const abs = Math.abs(v);
  if (abs < 0.005) return "$0.00";
  const s = abs.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const sign = signed ? (v < 0 ? "−" : "+") : (v < 0 ? "−" : "");
  return `${sign}$${s}`;
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function setDot(pill, cls, text) { pill.innerHTML = `<span class="dot ${cls}"></span>${esc(text)}`; }

function render(s) {
  $("balance").textContent = usd(s.balance_usd);

  const c = s.camera;
  if (c.simulate) setDot($("camPill"), "", "Camera: simulated");
  else setDot($("camPill"), c.connected ? "ok" : "bad", c.connected ? `Camera ${c.port}` : "Camera not connected");
  $("camLabel").textContent = c.label ? NOTE_NAME[c.label] : "—";
  $("camConf").textContent = c.conf != null ? Math.round(c.conf * 100) + "%" : "—";


  const st = $("stack"), stackKey = s.stack.join(",");
  if (stackKey !== lastStackKey) {
  lastStackKey = stackKey;
  st.innerHTML = s.stack.length ? s.stack.map((n, i) =>
    `<div class="bill${i === s.stack.length - 1 ? " top" : ""}"><img src="${NOTE_IMG[n]}" alt="${NOTE_NAME[n]} note"></div>`).join("")
    : "";
  }

  // Only rebuild the table when transactions changed, so an open dropdown isn't reset
  const txKey = JSON.stringify(s.transactions);
  if (txKey === lastTxKey) return;
  lastTxKey = txKey;

  const rows = $("rows");
  if (!s.transactions.length) {
    rows.innerHTML = "";
  } else {
    rows.innerHTML = s.transactions.map(tx => {
      const isNew = !firstRender && !seen.has(tx.id);
      const t = new Date(tx.time);
      const L = tx.location;
      const coords = L ? `${L.lat.toFixed(5)}, ${L.lng.toFixed(5)}` : "";
      const loc = !L ? `<span class="sub">unknown</span>`
        : `<a href="https://www.google.com/maps?q=${L.lat},${L.lng}" target="_blank">${L.name ? esc(L.name) : (L.name_status === "failed" ? "Unknown address" : "Finding address…")}</a>`;
      const cp = tx.counterparty_options.length
        ? tx.counterparty_options.map(v => `<div>${esc(v.name)}</div>`).join("")
        : `<span class="sub">${tx.counterparty_status === "searching" ? "Searching nearby…" : "—"}</span>`;
      const original = (tx.note === "ariary" || tx.note === "multiple") ? `<div class="sub">${esc(tx.original)}</div>` : "";
      const amt = tx.amount_usd == null ? `<span class="sub">pending</span>` : `<span class="amt ${tx.direction}">${usd(tx.amount_usd, true)}</span>`;
      let er = "";
      if (tx.er) {
        const upd = tx.er.source_updated ? new Date(tx.er.source_updated) : null;
        const fetched = new Date(tx.er.fetched_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        er = `<span class="amt" title="Live from ${esc(tx.er.source)}, fetched ${fetched}">${tx.er.mga_per_usd.toLocaleString("en-US", { maximumFractionDigits: 2 })}</span> <span class="sub">Ar/$</span>`;
      } else if (tx.er_status) {
        er = `<span class="sub">${esc(tx.er_status)}…</span>`;
      }
      return `<tr class="${isNew ? "new" : ""}">
        <td>${amt}${original}</td>
        <td>${er}</td>
        <td>${t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })}<div class="sub">${t.toLocaleDateString()}</div></td>
        <td>${loc}</td>
        <td>${cp}</td></tr>`;
    }).join("");
  }
  s.transactions.forEach(tx => seen.add(tx.id));
  firstRender = false;
}

const post = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });

document.addEventListener("change", e => {
  if (e.target.matches("select[data-tx]")) post(`/api/transactions/${e.target.dataset.tx}/counterparty`, { name: e.target.value || null });
});

document.querySelectorAll("[data-sim]").forEach(b => b.onclick = () => post("/api/simulate", { label: b.dataset.sim }));
$("reset").onclick = () => { if (confirm("Clear the stack and all transactions?")) post("/api/reset"); };

// Live updates from the laptop app
const es = new EventSource("/api/stream");
es.onmessage = e => render(JSON.parse(e.data));

// Laptop location (uses the OS location service through the browser)
if ("geolocation" in navigator) {
  navigator.geolocation.watchPosition(
    p => post("/api/location", { lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy }),
    err => console.warn("Location blocked: " + err.message),
    { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
} else {
  console.warn("No geolocation");
}
</script>
</body>
</html>
